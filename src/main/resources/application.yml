spring:
  application:
    name: leadership-intelligence
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lis}
    username: ${DB_USER:lis}
    password: ${DB_PASSWORD:lis}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      use-big-decimal-for-floats: true
    generator:
      write-bigdecimal-as-plain: true
  mvc:
    problemdetails:
      enabled: false
  session:
    # server-side sessions in PostgreSQL (decision D67); the tables come from Flyway (V11)
    jdbc:
      initialize-schema: never
    timeout: 30m
  # Outgoing email (decision D66). Set SPRING_MAIL_HOST (and _PORT, _USERNAME, _PASSWORD) to enable it; with no host,
  # emails are not sent and a warning says so. The sender address and links are lis.identity.* below.
server:
  # Behind a reverse proxy or load balancer set LIS_FORWARD_HEADERS=framework so the client address in the security audit and the
  # rate limits, and the Secure flag of the cookies, come from X-Forwarded-*. Leave it as none when the app is reached directly:
  # a client could otherwise send those headers itself and choose its own address.
  forward-headers-strategy: ${LIS_FORWARD_HEADERS:none}
  servlet:
    session:
      cookie:
        name: LIS_SESSION
        http-only: true
        # the cookie is sent over HTTPS only; the local compose stack turns this off (SERVER_SERVLET_SESSION_COOKIE_SECURE=false)
        secure: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  structured:
    format:
      console: ecs
lis:
  identity:
    # built-in accounts (decisions D65 to D74); every value shown is the default
    password-strength: 12
    verification-ttl: 24h
    reset-ttl: 1h
    session-absolute: 8h
    web-base-url: ${LIS_WEB_BASE_URL:http://localhost:3000}
    mail-from: ${LIS_MAIL_FROM:no-reply@localhost}
    mail-async: true
    # throttling of the sign-in and account endpoints (in memory, per instance, until the shared counters of phase P2)
    ip-requests-per-minute: 60
    login-failure-limit: 5
    login-lockout: 15m
    emails-per-address-per-hour: 5
    audit-hash-key: ${LIS_AUDIT_HASH_KEY:}
  engine:
    version: 3.0.0
    algorithm-version: 1.0.0
  logging:
    include-tenant-id: false
  configuration:
    initial:
      # the platform scoring configuration is a JSON file read at startup; see docs/configuration/INITIAL_CONFIGURATION.md
      enabled: true
      location: classpath:config/initial-platform-default.json
      mode: if-missing
