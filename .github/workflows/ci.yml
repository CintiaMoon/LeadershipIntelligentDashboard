name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # new vulnerabilities are published every day, so the dependency scan also runs on an unchanged main
    - cron: '17 4 * * 1'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests start PostgreSQL through Testcontainers (Docker is preinstalled).
      - run: mvn -B verify
      # Coverage is reported, not gated (docs/release/KNOWN_LIMITATIONS.md, item 22)
      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7} END {printf "### Backend coverage\n\nInstructions: %.1f %% (%d of %d)\n\nBranches: %.1f %% (%d of %d)\n", 100*ic/(im+ic), ic, im+ic, 100*bc/(bm+bc), bc, bm+bc}' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: target/site/jacoco
          if-no-files-found: ignore

  dependency-scan:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require the NVD API key
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::The repository secret NVD_API_KEY is missing, so the backend dependencies were NOT scanned. Create a free key at https://nvd.nist.gov/developers/request-an-api-key and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      # the vulnerability database is large; keep the latest copy between runs
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      # fails the build on a finding with CVSS 7 or more (pom.xml); reviewed exceptions go in config/dependency-check-suppressions.xml
      - run: mvn -B org.owasp:dependency-check-maven:12.1.0:check -DnvdApiKey="$NVD_API_KEY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # known vulnerabilities in the frontend dependencies (development tooling included)
      - run: npm audit --audit-level=high
      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # the whole stack: PostgreSQL, the mock identity provider, the application and the web UI
      - run: docker compose up -d --build
      - name: Install the test dependencies and the browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for the stack
        run: timeout 240 bash -c 'until curl -sf localhost:8080/actuator/health >/dev/null && curl -sf localhost:3000 >/dev/null; do sleep 5; done'
      - name: Browser tests
        working-directory: frontend
        run: npm run e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v
