# Local development stack.
#   docker compose up -d postgres mailpit redis     only the services; run the app with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   docker compose up -d --build                     everything: app on http://localhost:8080, web UI on http://localhost:3000,
#                                                    Mailpit inbox (confirmation, reset and invitation emails) on http://localhost:8025
# The "dev" profile seeds two demo tenants, the ILLUSTRATIVE sample configuration and demo accounts: sign in as owner@demo.test,
# admin@demo.test, platform-admin@demo.test, ... with the password demo-password-1234. Never use the profile in production.
# Host ports that often clash with other projects can be moved: LIS_POSTGRES_PORT=15432 LIS_REDIS_PORT=16379 docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lis
      POSTGRES_USER: lis
      POSTGRES_PASSWORD: lis
    ports:
      - "${LIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - lis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lis -d lis"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every email the application sends (confirmation, password-reset and invitation links) so nothing leaves the machine.
  # SMTP on 1025; read the messages at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  # Throttle counters of the sign-in and account endpoints (decision D71). Counters only: no persistence is needed, and the
  # application keeps counting in its own process if Redis is down.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${LIS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/lis
      DB_USER: lis
      DB_PASSWORD: lis
      # throttle counters are shared through Redis (decision D71)
      LIS_RATE_LIMIT_STORE: redis
      SPRING_DATA_REDIS_HOST: redis
      # outgoing email goes to Mailpit; links in the emails point at the web UI
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      LIS_WEB_BASE_URL: http://localhost:3000
      LIS_MAIL_FROM: no-reply@lis.local
      # the browser tests sign in far more often than a person would; the throttle itself is exercised by the unit and integration tests
      LIS_RATE_LIMIT_LOGIN_IP_LIMIT: "2000"
      # the local stack is plain HTTP, so the session cookie cannot be Secure here (production keeps the default, true)
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"

  # The web application: nginx serving the built SPA and proxying /api to the app, so the browser talks to one origin.
  frontend:
    build:
      context: ./frontend
    depends_on:
      - app
    ports:
      - "3000:80"

volumes:
  lis-pgdata:
